name: CI

on: [push, pull_request]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  test:
    # Pinned OS image (windows-latest moves between versions).
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # Pinned to the full commit SHA of the v6.1.0 tag (verified with git ls-remote).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false   # CI never pushes

      # Windows PowerShell 5.1: the same engine tunic.exe runs under.
      - name: Parse all PowerShell files
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }

      # Exact Pester version. No -SkipPublisherCheck: Pester is signed, and its README
      # says that flag should no longer be used.
      - name: Unit tests (Pester 5.9.1)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Repository PSGallery -Force -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.9.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'test/unit'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
